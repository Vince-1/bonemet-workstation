<?xml version="1.0" encoding="UTF-8"?>
<!-- BoneMet draft icon: minimalist / tech (Cursor-like). Export 1024 PNG then bonemet.ico -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BoneMet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="55%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Abstract spine: 4 rounded vertebrae, slight curve -->
  <g fill="url(#mark)" filter="url(#glow)">
    <rect x="218" y="118" width="76" height="52" rx="26" transform="rotate(-6 256 144)"/>
    <rect x="210" y="188" width="92" height="56" rx="28"/>
    <rect x="214" y="262" width="84" height="54" rx="27" transform="rotate(4 256 289)"/>
    <rect x="222" y="332" width="68" height="48" rx="24" transform="rotate(8 256 356)"/>
  </g>
  <!-- Subtle scan ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#67e8f9" stroke-width="2" opacity="0.18"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.12"/>
</svg>
