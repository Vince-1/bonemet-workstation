name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0). If empty, derived from tag vX.Y.Z"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          else
            ref="${GITHUB_REF_NAME:-}"
            ver="${ref#v}"
          fi
          if [[ -z "$ver" ]]; then
            echo "version missing" >&2
            exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release packs (no models)
        shell: bash
        run: |
          set -euo pipefail
          export BONEMET_VERSION="${{ steps.ver.outputs.version }}"
          export BUNDLE_MODELS=0
          export WITH_VENV=0
          export BONEMET_TARGET=all
          bash scripts/build-release-pack.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-release
          path: dist-release/*

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          name: "BoneMet Workstation v${{ steps.ver.outputs.version }}"
          files: |
            dist-release/*.zip
            dist-release/*.tar.gz
          generate_release_notes: true

  windows-setup:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) {
            $ref = "${env:GITHUB_REF_NAME}"
            if ($ref.StartsWith("v")) { $ver = $ref.Substring(1) } else { $ver = $ref }
          }
          if ([string]::IsNullOrWhiteSpace($ver)) { throw "version missing" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y
          choco install rsync -y
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $paths) { if (Test-Path $p) { Write-Host "ISCC=$p"; exit 0 } }
          throw "ISCC.exe not found after install"

      - name: Build Setup.exe (no signing)
        shell: pwsh
        run: |
          $env:BUNDLE_MODELS = "0"
          $env:WITH_VENV = "0"
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          $bash = "C:\Program Files\Git\bin\bash.exe"
          if (!(Test-Path $bash)) { $bash = "bash.exe" }
          .\installer\windows\one_click.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -IsccPath $iscc `
            -BuildReleasePack `
            -BashPath $bash

      - name: Upload Setup.exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*-Setup.exe
