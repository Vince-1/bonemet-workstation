# 复制为 data/models/registry.yaml 后执行 scripts/install_models.sh
# R-01 主线 B: p3first644 Active val-best continued_ep100, conf=0.24, imgsz=1280
# R-02 骨分割: Big.onnx + Rib.onnx + *Plans.json（项目内预处理，禁止引用 RadiSmart）

active:
  detect: detect_v1
  bone_seg: bone_seg

models:
  detect_v1:
    kind: onnx
    path: "{data_root}/models/detect/model.onnx"
    source_run: 1982single_cleaned_p0p1p2_p3first644_811_20260513_p5ft2_ft1280_continued_ep100
    conf_default: 0.24
    imgsz: 1280
    sha256: ""
  bone_seg:
    kind: onnx
    big_path: "{data_root}/models/bone_seg/Big.onnx"
    axis_path: "{data_root}/models/bone_seg/Rib.onnx"
    big_plans_path: "{data_root}/models/bone_seg/BigPlans.json"
    axis_plans_path: "{data_root}/models/bone_seg/RibPlans.json"
    sha256: ""
